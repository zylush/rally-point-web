<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your bRineLy email</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
      <tr>
        <td style="padding:24px 24px 16px;background:linear-gradient(135deg,#0f766e,#115e59);color:#ffffff;">
          <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.9;">bRineLy · brinely.info</p>
          <h1 style="margin:6px 0 0;font-size:22px;line-height:1.3;">Confirm your email</h1>
        </td>
      </tr>
      <tr>
        <td style="padding:24px;">
          <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
            Enter this 6-digit verification code in bRineLy to finish setting up your player account:
          </p>
          <div style="margin:0 0 20px;padding:16px;border-radius:12px;background:#f0fdfa;border:1px solid #99f6e4;text-align:center;">
            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:800;letter-spacing:0.25em;color:#115e59;">{{ .Token }}</span>
          </div>
          <p style="margin:0 0 12px;font-size:13px;line-height:1.5;color:#64748b;">
            This code expires in 60 minutes. If you did not try to create an account, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
