name: CI

# Every push and pull request runs lint, tests and the production build.
# Publishing is Vercel's job: its Git integration deploys `main` to https://brinely.info
# (vercel.json, `npm run build:vercel`). GitHub Pages is retired.
# Database migrations are never applied here; they go through reviewed release packages.

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Runs every suite except the ones that need the owner's local-only
      # release evidence; see vitest.ci.config.ts. The full suite still runs
      # locally before each push.
      - name: Test
        run: npx --no-install vitest run --config vitest.ci.config.ts

      - name: Build (browser demo, type check included)
        run: npm run build
